    // Создаёт лёгкий thumbnail и возвращает ObjectURL (отзывать потом!)
    async function generateThumbnail(file, maxSide = 180, quality = 0.78) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.naturalWidth;
                let h = img.naturalHeight;

                // Сохраняем пропорции
                if (w > h) {
                    if (w > maxSide) { h = Math.round(h * (maxSide / w)); w = maxSide; }
                } else {
                    if (h > maxSide) { w = Math.round(w * (maxSide / h)); h = maxSide; }
                }

                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                canvas.toBlob(blob => {
                    if (blob) {
                        const thumbUrl = URL.createObjectURL(blob);
                        previewURLs.add(thumbUrl);
                        resolve(thumbUrl);
                    } else {
                        reject(new Error('Не удалось создать thumbnail'));
                    }
                    URL.revokeObjectURL(url); // сразу чистим оригинальный URL
                }, 'image/jpeg', quality);
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error('Ошибка загрузки изображения'));
            };
            img.src = url;
        });
    }
    // Функция для сжатия оригинального изображения (JPEG, с сохранением имени)
    async function compressImage(file, quality = 0.94) {
        if (file.size < 400 * 1024) return file; // Не сжимаем маленькие файлы

        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                canvas.toBlob(blob => {
                    if (!blob) {
                        reject(new Error('Не удалось сжать изображение'));
                        return;
                    }
                    const compressedFile = new File([blob], file.name, {
                        type: 'image/jpeg',
                        lastModified: file.lastModified
                    });
                    resolve(compressedFile);
                    URL.revokeObjectURL(url);
                }, 'image/jpeg', quality);
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error('Ошибка загрузки изображения'));
            };
            img.src = url;
        });
    }

  // Перетаскивание
  function makeTextDraggable(el) {
  let isDragging = false;
  let startX, startY, startLeft, startTop;
  let currentSlot = el.parentElement;

  // Сохраняем начальные координаты
  function getPosition() {
    return {
      left: parseFloat(el.style.left) || 0,
      top: parseFloat(el.style.top) || 0
    };
  }

  el.onmousedown = (e) => {
    e.stopPropagation();
    if (e.button !== 0) return; // только левая кнопка

    isDragging = true;
    const pos = getPosition();
    startLeft = pos.left;
    startTop = pos.top;
    startX = e.clientX;
    startY = e.clientY;

    // Поднимаем элемент
    el.style.zIndex = '1000';
    el.style.transition = 'none';

    document.onmousemove = (e) => {
      if (!isDragging) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      el.style.left = (startLeft + dx) + 'px';
      el.style.top = (startTop + dy) + 'px';

      // Проверяем, под каким слотом курсор
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const targetSlot = under?.closest('.slot');
      if (targetSlot && targetSlot !== currentSlot) {
        // Перемещаем в новый слот
        targetSlot.appendChild(el);
        currentSlot = targetSlot;

        // Пересчитываем позицию относительно нового слота
        const rect = currentSlot.getBoundingClientRect();
        const newLeft = e.clientX - rect.left;
        const newTop = e.clientY - rect.top;
        el.style.left = newLeft + 'px';
        el.style.top = newTop + 'px';

        // Обновляем начальные координаты
        startLeft = newLeft;
        startTop = newTop;
        startX = e.clientX;
        startY = e.clientY;
      }
    };

    // === Двойной клик — редактирование ===
// === ДВОЙНОЙ КЛИК — РЕДАКТИРОВАНИЕ ===
el.ondblclick = (e) => {
  e.stopPropagation();

  const currentText = el.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentText;
  input.style.position = 'absolute';
  input.style.left = '0';
  input.style.top = '0';
  input.style.width = '100%';
  input.style.height = '100%';
  input.style.fontFamily = el.style.fontFamily;
  input.style.fontSize = el.style.fontSize;
  input.style.color = el.style.color;
  input.style.background = 'rgba(255,255,255,0.95)';
  input.style.border = '2px solid #49aaff';
  input.style.borderRadius = '4px';
  input.style.padding = '4px';
  input.style.outline = 'none';
  input.style.zIndex = '1001';

  const parent = el.parentElement;
  const rect = el.getBoundingClientRect();
  const parentRect = parent.getBoundingClientRect();

  // Сохраняем оригинальный position слота
  const originalPosition = parent.style.position;
  parent.style.position = 'relative';

  el.style.visibility = 'hidden';

  // Позиционируем input точно над текстом
  input.style.left = (rect.left - parentRect.left) + 'px';
  input.style.top = (rect.top - parentRect.top) + 'px';
  input.style.width = rect.width + 'px';
  input.style.height = rect.height + 'px';

  parent.appendChild(input);
  input.focus();
  input.select();

  const save = () => {
    const newText = input.value.trim();
    if (newText) {
      el.textContent = newText;
      const item = coverTexts.find(t => t.id === el.dataset.id);
      if (item) item.text = newText;
    }
    input.remove();
    el.style.visibility = 'visible';
    parent.style.position = originalPosition; // ← ВОССТАНАВЛИВАЕМ!
    updateTextList();
  };

  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      save();
    } else if (e.key === 'Escape') {
      input.remove();
      el.style.visibility = 'visible';
      parent.style.position = originalPosition; // ← ВОССТАНАВЛИВАЕМ!
    }
  };

  input.onblur = save;
};

    document.onmouseup = () => {
      if (!isDragging) return;
      isDragging = false;

      document.onmousemove = document.onmouseup = null;
      el.style.zIndex = '15';
      el.style.transition = '';

      // Сохраняем финальную позицию
      const final = getPosition();
      const item = coverTexts.find(t => t.id === e.target.dataset.id);
      if (item) {
        item.x = final.left;
        item.y = final.top;
        item.slot = currentSlot.dataset.cover || 'front';
      }
    };
  };
}
